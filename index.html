<style>
/* Layout: one-screen phone app. Fixed bottom bar, scrolling main column, sticky action footer on capture screens. */
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--surface2:#EDEFF2;--ink:#0D1117;--ink2:#353C48;--muted:#596170;--line:#E2E5EA;
  --accent:#2B44D6;--accentInk:#FFFFFF;--accentSoft:#E7EAFB;
  --ok:#0F6E46;--okSoft:#DFF2E7;--warn:#875300;--warnSoft:#FCEFD2;--bad:#AE2B25;--badSoft:#FBE3E1;--pend:#5D6572;--pendSoft:#ECEEF1;
  --thR:#E1E6FB;--thRi:#2B44D6;--thL:#F2E4D4;--thLi:#7A4719;--thF:#DAEFEC;--thFi:#14625C;
  --scan:#06070A;--shadow:0 1px 2px rgba(13,17,23,.04),0 6px 20px rgba(13,17,23,.05);
  --f-ui:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0D11;--surface:#14171D;--surface2:#1E222A;--ink:#F2F4F7;--ink2:#CBD0D8;--muted:#9AA2AE;--line:#262B34;
  --accent:#8392FF;--accentInk:#0B0D11;--accentSoft:#1F2547;
  --ok:#4FC98F;--okSoft:#11281D;--warn:#EBB650;--warnSoft:#2B2212;--bad:#F2786E;--badSoft:#2E1716;--pend:#9199A6;--pendSoft:#20242C;
  --thR:#232A55;--thRi:#B3BDFF;--thL:#3A2A1A;--thLi:#F0C79B;--thF:#123230;--thFi:#8EDDD3;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D11;--surface:#14171D;--surface2:#1E222A;--ink:#F2F4F7;--ink2:#CBD0D8;--muted:#9AA2AE;--line:#262B34;
  --accent:#8392FF;--accentInk:#0B0D11;--accentSoft:#1F2547;
  --ok:#4FC98F;--okSoft:#11281D;--warn:#EBB650;--warnSoft:#2B2212;--bad:#F2786E;--badSoft:#2E1716;--pend:#9199A6;--pendSoft:#20242C;
  --thR:#232A55;--thRi:#B3BDFF;--thL:#3A2A1A;--thLi:#F0C79B;--thF:#123230;--thFi:#8EDDD3;--shadow:none;color-scheme:dark}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
#app{padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
h1,h2,p{margin:0}
h1{text-wrap:balance}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.main{flex:1;min-height:0;overflow-y:auto;padding:16px 16px 28px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,background-color .15s ease}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mono{font-family:var(--f-mono);letter-spacing:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.lbl{font-size:13px;font-weight:500;color:var(--muted)}
.sec{font-size:12.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.col{display:flex;flex-direction:column}
.row-f{display:flex;align-items:center}
.btn-p{width:100%;min-height:58px;border:0;border-radius:18px;background:var(--accent);color:var(--accentInk);font-size:17px;font-weight:650;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px;text-decoration:none}
.btn-p.xl{min-height:70px;font-size:19px;border-radius:22px}
.btn-p.ok{background:var(--ok);color:#fff}
.btn-p:disabled{opacity:.5}
.btn-s{width:100%;min-height:50px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);font-size:15.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;text-decoration:none;text-align:center}
.btn-s.danger{color:var(--bad)}
.btn-g{min-height:44px;border:0;background:transparent;color:var(--accent);font-size:15px;font-weight:600;padding:0 10px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-g.ink{color:var(--ink)}
.btn-g.soft{background:var(--accentSoft)}
.step{width:62px;height:62px;border:0;border-radius:18px;background:var(--surface2);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.step.add{background:var(--accent);color:var(--accentInk)}
.step.sm{width:50px;height:50px;border-radius:15px}
.bignum{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-family:inherit;font-size:42px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield;appearance:textfield}
.bignum::-webkit-outer-spin-button,.bignum::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.bignum:focus{outline:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:650;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.st-done{background:var(--okSoft);color:var(--ok)}.st-review{background:var(--warnSoft);color:var(--warn)}.st-bad{background:var(--badSoft);color:var(--bad)}
.st-pend,.st-out{background:var(--pendSoft);color:var(--pend)}.st-acc{background:var(--accentSoft);color:var(--accent)}
.c-done{color:var(--ok)}.c-review{color:var(--warn)}.c-bad{color:var(--bad)}.c-pend{color:var(--pend)}.c-acc{color:var(--accent)}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface2);border-radius:15px}
.seg button{flex:1;min-width:0;min-height:44px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;padding:0 6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(13,17,23,.12)}
.fchip{min-height:38px;padding:0 15px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:14px;font-weight:550;white-space:nowrap;flex:none}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.input{width:100%;min-height:54px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:0 16px;font-family:inherit;font-size:17px;color:var(--ink)}
.input::placeholder{color:var(--muted);opacity:.8}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accentSoft)}
.input.err{border-color:var(--bad)}
textarea.input{padding:14px 16px;min-height:90px;resize:vertical;line-height:1.4;font-size:15.5px}
.field{display:flex;flex-direction:column;gap:7px}
.lrow{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;border:0;background:transparent;color:var(--ink);text-align:left;font-family:inherit;min-height:64px}
.lrow + .lrow{border-top:1px solid var(--line)}
.th{border-radius:7px;display:flex;align-items:flex-end;padding:5px 6px;font-weight:750;letter-spacing:-.02em;flex:none;width:38px;height:48px;font-size:12px}
.th.big{width:56px;height:72px;font-size:18px;border-radius:9px;padding:7px 8px}
.th-Revista{background:var(--thR);color:var(--thRi)}.th-Libro{background:var(--thL);color:var(--thLi)}.th-Folleto{background:var(--thF);color:var(--thFi)}
.sw{width:51px;height:31px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--ok)}.sw.on::after{transform:translateX(20px)}
button.sw:active{transform:none}
.nav{height:calc(72px + env(safe-area-inset-bottom,0px));padding:6px 4px env(safe-area-inset-bottom,0px);flex:none;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:flex-start}
.nv{flex:1;min-height:60px;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:600;padding:0}
.nv.on{color:var(--ink)}
.fab{width:62px;height:62px;border-radius:21px;border:0;background:var(--accent);color:var(--accentInk);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(43,68,214,.35);margin-top:-22px}
.foot{flex:none;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 30px rgba(13,17,23,.06)}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 0 4px;min-height:52px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14.5px;font-weight:550;max-width:calc(100% - 32px);z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .25s ease-out;text-align:center}
.banner{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;border-radius:15px;font-size:14px;font-weight:550;line-height:1.4}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>div{height:100%;border-radius:99px;background:var(--ok);transition:width .5s}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{padding:15px;text-align:left;display:flex;flex-direction:column;gap:9px;font-family:inherit;color:var(--ink)}
.kpi span:first-child{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--muted)}
.kpi .num{font-size:28px;font-weight:750;line-height:1}
.scanwrap{flex:1;min-height:0;overflow-y:auto;background:var(--scan);color:#fff;display:flex;flex-direction:column;padding:12px 16px calc(20px + env(safe-area-inset-bottom,0px));gap:16px}
.scanwrap .lbl{color:rgba(255,255,255,.7)}
.shoot{width:100%;border:0;border-radius:26px;background:rgba(255,255,255,.07);color:#fff;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:14px;font-family:inherit;position:relative}
.vf{width:220px;height:130px;position:relative}
.vf i{position:absolute;width:34px;height:34px;border:0 solid #fff}
.vf i:nth-child(1){left:0;top:0;border-left-width:4px;border-top-width:4px;border-top-left-radius:16px}
.vf i:nth-child(2){right:0;top:0;border-right-width:4px;border-top-width:4px;border-top-right-radius:16px}
.vf i:nth-child(3){left:0;bottom:0;border-left-width:4px;border-bottom-width:4px;border-bottom-left-radius:16px}
.vf i:nth-child(4){right:0;bottom:0;border-right-width:4px;border-bottom-width:4px;border-bottom-right-radius:16px}
.vf.hit i{border-color:#3DDC97}.vf.miss i{border-color:#FF8A80}
.laser{position:absolute;left:18px;right:18px;top:64px;height:2px;background:#FF5A4F;box-shadow:0 0 14px rgba(255,90,79,.9);animation:scan 1.9s ease-in-out infinite}
.dk-input{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
.dk-input::placeholder{color:rgba(255,255,255,.6)}
.dk-btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.sheet{background:var(--surface);color:var(--ink);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:rot .8s linear infinite}
.pop{animation:pop .45s cubic-bezier(.2,.8,.2,1)}
.scr{animation:up .2s ease-out}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 12px 12px}
.empty .ic{width:62px;height:62px;border-radius:21px;background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center}
table.rep{width:100%;border-collapse:collapse;font-size:14px}
table.rep th{text-align:left;font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;background:var(--surface2)}
table.rep td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
table.rep td.q,table.rep th.q{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted);word-break:break-all}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.camBox{position:relative;width:100%;aspect-ratio:4/3;max-height:52vh;border-radius:24px;overflow:hidden;background:#000;flex:none}
.camBox video{width:100%;height:100%;object-fit:cover;display:block}
.camBox .vf{position:absolute;left:50%;top:50%;width:min(76%,300px);height:56%;transform:translate(-50%,-50%)}
.camBox .laser{top:50%}
.camTorch{position:absolute;right:12px;top:12px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center}
.camTorch.on{background:#FFD60A;color:#06070A}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pop{0%{opacity:0;transform:scale(.5)}60%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes scan{0%,100%{transform:translateY(-50px)}50%{transform:translateY(50px)}}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function calc(f){

  var f = { pubId: pubId, mode: mode, editId: editId || null, packs: 0, looseMode: (p.pack > 1) ? (p.avg ? 'weight' : 'none') : (p.avg ? 'weight' : 'manual'), kg: '', looseN: 0, adj: 0, tare: false, loc: st.settings.loc || '' };
  if (mode === 'edit'){
    var ps = partsFor(pubId), c = null, i;
    for (i = 0; i < ps.length; i++) if (ps[i].id === editId){ c = ps[i]; f.partNo = i + 1; }
    if (!c) return;
    f.packs = c.packs || 0; f.looseMode = c.looseMode || 'none'; f.kg = c.kg || ''; f.looseN = c.looseN || 0; f.adj = c.adj || 0; f.tare = !!c.tare; f.loc = c.loc || '';
  }
  st.form = f; st.scan = { state: 'idle' }; go('count', back || 'home');
}
function saveCount(next){
  var f = st.form; if (!f || st.saving) return;
  var k = calc(f); if (k.kgBad) return;
  if (f.mode === 'add' && k.part === 0){ toast('Registra las piezas de esta ubicación para sumarlas'); return; }
  st.saving = true; paintCount();
  var now = new Date().toISOString(), id = f.mode === 'edit' ? f.editId : newId();
  var prevDoc = f.mode === 'edit' ? st.counts[id] : null;
  var doc = { inv: st.month, pubId: f.pubId, qty: k.part, packs: k.packs, packSize: k.pack, looseMode: f.looseMode, kg: f.looseMode === 'weight' ? String(f.kg).replace(',', '.') : '', tare: !!f.tare, tareKg: f.tare ? pnum(st.settings.tareKg) || 0 : 0, avgUsed: k.p.avg || 0, looseN: f.looseMode === 'manual' ? pint(f.looseN) : 0, adj: f.looseMode === 'none' ? 0 : (f.adj || 0), conf: k.conf, method: methodTxt(f, k), loc: String(f.loc || '').trim().slice(0, 60), by: st.uid || 'local', at: prevDoc ? prevDoc.at : now, deleted: false };
  if (prevDoc){
    var hist = (prevDoc.history || []).slice(-9); var snap = Object.assign({}, prevDoc); delete snap.history; hist.push(snap);
    doc.history = hist; doc.editedAt = now; doc.editedBy = st.uid || 'local';
  }
  if (f.loc){ st.settings.loc = String(f.loc).trim(); saveSettings(); }
  write('counts', id, doc);
  buzz([40, 40, 40]);
  var tot = totalFor(f.pubId), pv = prevTotal(f.pubId), nParts = partsFor(f.pubId).length;
  st.lastSaved = { pubId: f.pubId, id: id, name: k.p.name, total: tot, part: k.part, prev: pv, nParts: nParts, wasNew: !prevDoc, prevDoc: prevDoc, mode: f.mode,
    line: nParts > 1 ? 'Ubicación ' + nParts + ': +' + nf(k.part) + ' · suma de ' + nParts + ' ubicaciones' : (pv != null ? monthShort(prevKey(st.month)) + ' ' + nf(pv) + ' · ' + sg(tot - pv) : 'Primer conteo registrado') };
  if (f.mode === 'add') toast('Sumado: +' + nf(k.part) + ' · total ' + nf(tot));
  st.saving = false; st.form = null;
  var s = summary();
  if (!s.pending && f.mode === 'new'){ st.reportMonth = st.month; go('done'); return; }
  if (next){ st.scan = { state: 'idle' }; go('scan', 'home'); } else go('saved');
}
function undoLast(){
  var l = st.lastSaved; if (!l) return;
  if (l.wasNew){ var d = Object.assign({}, st.counts[l.id], { deleted: true, deletedAt: new Date().toISOString() }); write('counts', l.id, d); }
  else if (l.prevDoc) write('counts', l.id, l.prevDoc);
  st.lastSaved = null; toast('Registro deshecho'); render();
}

  return viaImg(file);
}
function viaImg(file){ return new Promise(function(res, rej){ var u = URL.createObjectURL(file), im = new Image(); im.onload = function(){ res(im); }; im.onerror = rej; im.src = u; }); }
function toCanvas(src, max){
  var w = src.width, h = src.height, k = Math.min(1, max / Math.max(w, h));
  var cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
  cv.getContext('2d', { willReadFrequently: true }).drawImage(src, 0, 0, cv.width, cv.height); return cv;
}
function decodeImage(file){
  return loadBitmap(file).then(function(bmp){
    var tryNative = ('BarcodeDetector' in window) ? (function(){ try { return new window.BarcodeDetector().detect(bmp).then(function(r){ return r && r.length ? r[0].rawValue : null; }, function(){ return null; }); } catch (e){ return Promise.resolve(null); } })() : Promise.resolve(null);
    return tryNative.then(function(v){
      if (v) return v;
      return Promise.all([loadScript(LIB.jsqr).catch(function(){}), loadScript(LIB.zxing).catch(function(){})]).then(function(){
        var sizes = [1400, 900, 2200];
        for (var i = 0; i < sizes.length; i++){
          var cv = toCanvas(bmp, sizes[i]);
          if (window.jsQR){ try { var d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height); var q = window.jsQR(d.data, cv.width, cv.height); if (q && q.data) return q.data; } catch (e){} }

}

function camSync(){
  var onScan = st.screen === 'scan' && st.mode !== 'setup' && st.mode !== 'auth';

    clearTimeout(cam.stopTimer); camStart();
  } else if (cam.stream && !onScan){
    clearTimeout(cam.stopTimer); cam.stopTimer = setTimeout(camStop, 20000);
  }

}

function decodeFrame(v){

    return cam.detector.detect(v).then(function(r){ return r && r.length ? r[0].rawValue : null; }, function(){ return null; });

  } catch (e){}

}

function handleCode(raw){

  var p = findByCode(code);

  buzz(60);

  openCount(p.id, 'new', 'scan');
}
function searchTyped(v){

  var q = v.toLowerCase(), rs = summary().rows.filter(function(r){ return String(r.p.name).toLowerCase().indexOf(q) >= 0 || (r.p.codes || []).some(function(c){ return normCode(c).indexOf(q) >= 0; }); });

}

  saveCalib: function(){ saveCalib(); },
  newPub: function(){ openEdit(null, st.screen === 'catalog' ? 'catalog' : st.screen === 'home' ? 'home' : 'inventory'); },
  newPubCode: function(){ openEdit(null, 'scan', { codes: [st.scan.code], thenCount: true }); },
  assignOpen: function(){ st.scan.assign = true; render(); var e = $('#assignQ'); if (e) e.focus(); },
  assignTo: function(id){ var p = st.pubs[id], code = st.scan.code; write('pubs', id, Object.assign({}, p, { codes: (p.codes || []).concat([code]), updatedAt: new Date().toISOString() })); toast('Código agregado a ' + p.name); st.scan = { state: 'idle' }; handleCode(code); },
  editPub: function(id){ openEdit(id, st.screen); },
  rmCode: function(i){ readEdit(); st.edit.codes.splice(+i, 1); render(); },
  addCode: function(){ readEdit(); var e = $('#e-newcode'); addCodeToEdit(e ? e.value : ''); render(); },
  eType: function(v){ readEdit(); st.edit.type = v; render(); },
  ePres: function(v){ readEdit(); st.edit.pres = v; render(); },
  eActive: function(v){ readEdit(); st.edit.active = v === '1'; render(); },
  savePub: function(){ savePub(); },
  sw: function(v){ st.settings[v] = !st.settings[v]; saveSettings(); render(); },
  theme: function(v){ st.settings.theme = v; saveSettings(); render(); },
  month: function(v){ st.month = v; if (st.mode === 'cloud') subscribe(); render(); },
  report: function(v){ st.reportMonth = v; go('report', st.screen); },
  copyWa: function(v){
    var txt = waText(v);
    var done = function(){ buzz(30); toast('Copiado. Pégalo en el chat de la sucursal.'); };
    var fallback = function(){ var b = $('#waBox'); if (b){ b.focus(); b.select(); } toast('Selecciona el texto de abajo y cópialo.'); };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e){ fallback(); }
  },
  xls: function(v){ exportXls(v); }, pdf: function(v){ exportPdf(v); },
  closeInv: function(){ closeInv(); },
  reopen: function(){ var v = st.invs[st.month]; write('invs', st.month, Object.assign({}, v, { status: 'abierto' })); toast('Inventario reabierto'); render(); },
  import: function(){ $('#importFile').click(); },
  logout: function(){ camStop(); if (sb) sb.auth.signOut(); st.mode = 'auth'; render(); },
  useLocal: function(){ LS.set('forceLocal', true); st.mode = 'local'; render(); },
  torch: function(){ camTorch(); },
  camRetry: function(){ cam.denied = false; render(); },
  template: function(){ exportTemplate(); }
};
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-a]'); if (!el || !app.contains(el) || el.disabled) return;
  var fn = A[el.getAttribute('data-a')]; if (!fn) return;
  e.preventDefault(); fn(el.getAttribute('data-v'), el, e);
});
document.addEventListener('submit', function(e){
  var f = e.target.closest('[data-f]'); if (!f) return; e.preventDefault();
  if (f.getAttribute('data-f') === 'codeForm'){ var v = $('#codeIn').value; st.scan.typed = v; searchTyped(v); }
  if (f.getAttribute('data-f') === 'login') doLogin();
  if (f.getAttribute('data-f') === 'name'){ var n = $('#n-name').value.trim(); if (n){ write('people', st.uid, { name: n.slice(0, 40), email: st.email }); render(); } }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && e.target && e.target.id === 'e-newcode'){ e.preventDefault(); A.addCode(); }
});
var nameTimer;
document.addEventListener('input', function(e){
  var t = e.target, k = t.getAttribute && t.getAttribute('data-i'); if (!k) return;
  var f = st.form;
  if (k === 'packs'){ f.packs = t.value === '' ? '' : pint(t.value); paintCount(); }
  else if (k === 'kg'){ f.kg = t.value; f.adj = 0; paintCount(); }
  else if (k === 'looseN'){ f.looseN = t.value === '' ? '' : pint(t.value); paintCount(); }
  else if (k === 'loc'){ f.loc = t.value; }
  else if (k === 'invQ'){ st.q = t.value; var l = $('#invList'); if (l) l.innerHTML = invList(); }
  else if (k === 'catQ'){ st.cq = t.value; var q = normCode(t.value); var l2 = $('#catList'); if (l2) l2.innerHTML = catList(pubList(true).filter(function(p){ return !q || p.name.toLowerCase().indexOf(q) >= 0 || (p.codes || []).some(function(c){ return normCode(c).indexOf(q) >= 0; }); })); }
  else if (k === 'assignQ'){ st.scan.assignQ = t.value; var l3 = $('#assignList'); if (l3) l3.innerHTML = assignList(); }
  else if (k === 'ckg'){ st.calib.kg = t.value; var r = $('#calRes'); if (r) r.innerHTML = calibRes(st.calib, st.pubs[st.calib.pubId] || { avg: st.calib.curAvg }); var b = $('#b-cal'); if (b) b.disabled = !(pnum(t.value) > 0); }
  else if (k === 'sloc'){ st.settings.loc = t.value.trim(); saveSettings(); }
  else if (k === 'stare'){ st.settings.tareKg = t.value; saveSettings(); }
  else if (k === 'sname'){ clearTimeout(nameTimer); var v = t.value.trim(); nameTimer = setTimeout(function(){ if (v) write('people', st.uid, { name: v.slice(0, 40), email: st.email }); }, 700); }
});

/* ---------- arranque ---------- */
render();
(function boot(){
  if (!CFG.url || !CFG.key || /TU_PROYECTO|PEGA_AQUI/.test(CFG.url + CFG.key) || !window.supabase){
    st.mode = LS.get('forceLocal', false) ? 'local' : 'setup'; render(); return;
  }
  sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'invpub-auth' } });
  sb.auth.getSession().then(function(r){
    var s = r.data && r.data.session;
    if (s) onSignedIn(s); else { st.mode = 'auth'; render(); }
  }, function(){ st.mode = 'auth'; render(); });
  sb.auth.onAuthStateChange(function(ev, session){
    if (ev === 'SIGNED_OUT'){ st.mode = 'auth'; st.uid = null; render(); }
    if (ev === 'TOKEN_REFRESHED' && session) flush();
  });
})();
function onSignedIn(s){
  st.uid = s.user.id; st.email = s.user.email || ''; st.mode = 'cloud';
  subscribe(); flush();
  render();
}

})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
